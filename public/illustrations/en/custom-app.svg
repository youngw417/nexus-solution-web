<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Custom business software running on a laptop and a phone">
  <style>.d{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}.b{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,monospace}</style>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#111" flood-opacity=".16"/></filter>
    <clipPath id="ls"><rect x="48" y="58" width="320" height="196"/></clipPath>
    <clipPath id="ps"><rect x="352" y="134" width="88" height="180" rx="12"/></clipPath></defs>
  <rect width="480" height="360" fill="#F3F1F1"/>
  <circle cx="300" cy="170" r="140" fill="#E3E8F0"/>

  <!-- Laptop -->
  <g filter="url(#sh)">
    <rect x="38" y="48" width="340" height="216" rx="10" fill="#2A2523"/>
    <path d="M14 264 H402 L388 282 Q384 286 376 286 H40 Q32 286 28 282 Z" fill="#2E2E2E"/>
    <rect x="178" y="264" width="60" height="5" rx="2" fill="#5E5653"/>
  </g>
  <g clip-path="url(#ls)">
    <rect x="48" y="58" width="320" height="196" fill="#FFFFFF"/>
    <rect x="48" y="58" width="62" height="196" fill="#2A2523"/>
    <g fill="#6B7C98"><rect x="58" y="70" width="12" height="2.5"/><rect x="58" y="74.5" width="12" height="2.5"/><rect x="58" y="79" width="12" height="2.5"/></g>
    <g fill="#5E5653"><rect x="58" y="102" width="40" height="5"/><rect x="58" y="134" width="34" height="5"/><rect x="58" y="150" width="42" height="5"/><rect x="58" y="166" width="30" height="5"/></g>
    <rect x="52" y="113" width="58" height="17" fill="#2E2E2E"/><rect x="58" y="119" width="38" height="5" fill="#FFFFFF"/><rect x="48" y="113" width="3" height="17" fill="#6B7C98"/>
    <text x="122" y="82" class="d" font-size="12" fill="#2A2523">Order Management</text>
    <rect x="300" y="70" width="56" height="18" rx="2" fill="#6B7C98"/><text x="328" y="82.5" text-anchor="middle" class="b" font-size="8" fill="#fff">+ New order</text>
    <g class="b" font-size="8" fill="#67636A">
      <rect x="122" y="96" width="74" height="40" fill="#F3F1F1"/><text x="130" y="110">New today</text><text x="130" y="128" class="d" font-size="14" fill="#111">48</text>
      <rect x="202" y="96" width="74" height="40" fill="#F3F1F1"/><text x="210" y="110">To ship</text><text x="210" y="128" class="d" font-size="14" fill="#111">17</text>
      <rect x="282" y="96" width="74" height="40" fill="#E3E8F0"/><text x="290" y="110" fill="#6B7C98">Low stock</text><text x="290" y="128" class="d" font-size="14" fill="#6B7C98">3</text>
    </g>
    <g class="m" font-size="7.5" fill="#67636A"><text x="122" y="152">Order no.</text><text x="180" y="152">Customer</text><text x="250" y="152">Qty</text><text x="300" y="152">Status</text></g>
    <rect x="122" y="156" width="234" height="1" fill="#D3CDCB"/>
    <g class="b" font-size="8.5" fill="#2A2523">
      <text x="122" y="172">A-1093</text><text x="180" y="172">Pangyo Trading</text><text x="250" y="172">120</text>
      <text x="122" y="192">A-1092</text><text x="180" y="192">Hanbit Supply</text><text x="250" y="192">40</text>
      <text x="122" y="212">A-1091</text><text x="180" y="212">Seohyun Works</text><text x="250" y="212">300</text>
      <text x="122" y="232">A-1090</text><text x="180" y="232">Jeongja Corp.</text><text x="250" y="232">75</text>
    </g>
    <g class="b" font-size="7.5">
      <rect x="298" y="164" width="38" height="12" rx="6" fill="#111"/><text x="317" y="172.5" text-anchor="middle" fill="#fff">Shipped</text>
      <rect x="298" y="184" width="38" height="12" rx="6" fill="#E4E0E0"/><text x="317" y="192.5" text-anchor="middle" fill="#5E5653">Pending</text>
      <rect x="298" y="204" width="38" height="12" rx="6" fill="#6B7C98"/><text x="317" y="212.5" text-anchor="middle" fill="#fff">Checked</text>
      <rect x="298" y="224" width="38" height="12" rx="6" fill="#111"/><text x="317" y="232.5" text-anchor="middle" fill="#fff">Shipped</text>
    </g>
    <g fill="#E4E0E0"><rect x="122" y="178" width="234" height="1"/><rect x="122" y="198" width="234" height="1"/><rect x="122" y="218" width="234" height="1"/></g>
  </g>

  <!-- Phone -->
  <g filter="url(#sh)"><rect x="344" y="126" width="104" height="196" rx="18" fill="#2A2523"/></g>
  <g clip-path="url(#ps)">
    <rect x="352" y="134" width="88" height="180" fill="#FFFFFF"/>
    <text x="362" y="164" class="d" font-size="10" fill="#111">Shipping Check</text>
    <rect x="352" y="172" width="88" height="2" fill="#6B7C98"/>
    <g class="b" font-size="7.5" fill="#5E5653">
      <rect x="360" y="182" width="72" height="34" rx="3" fill="#F3F1F1"/><text x="366" y="196" fill="#111" font-weight="700">A-1091</text><text x="366" y="208" font-size="6.6">Seohyun Works · 300</text>
      <rect x="360" y="222" width="72" height="34" rx="3" fill="#F3F1F1"/><text x="366" y="236" fill="#111" font-weight="700">A-1089</text><text x="366" y="248" font-size="6.6">Pangyo Trading · 60</text>
    </g>
    <rect x="360" y="278" width="72" height="22" rx="3" fill="#6B7C98"/><text x="396" y="292.5" text-anchor="middle" class="d" font-size="8.5" fill="#fff">Scan barcode</text>
    <rect x="374" y="142" width="44" height="10" rx="5" fill="#111"/>
  </g>

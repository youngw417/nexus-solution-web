<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="AI automatically extracting the customer, date, and amount from a receipt">
  <style>.d{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}.b{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,monospace}</style>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111" flood-opacity=".14"/></filter>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6B7C98" stop-opacity="0"/><stop offset="1" stop-color="#6B7C98" stop-opacity=".18"/></linearGradient></defs>
  <rect width="480" height="360" fill="#F3F1F1"/>
  <circle cx="330" cy="180" r="130" fill="#E3E8F0"/>

  <!-- Receipt -->
  <g filter="url(#sh)" transform="rotate(-4 130 180)">
    <path d="M60 36 H196 V318 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 l-8.5 -8 l-8.5 8 Z" fill="#FFFFFF"/>
    <text x="128" y="66" text-anchor="middle" class="d" font-size="12" fill="#111">Pangyo Trading</text>
    <text x="128" y="82" text-anchor="middle" class="m" font-size="8" fill="#67636A">2026.11.12 14:05</text>
    <path d="M72 94 H184" stroke="#B9B1AD" stroke-dasharray="3 3"/>
    <g fill="#B9B1AD"><rect x="72" y="106" width="60" height="5"/><rect x="160" y="106" width="24" height="5"/><rect x="72" y="122" width="48" height="5"/><rect x="160" y="122" width="24" height="5"/><rect x="72" y="138" width="66" height="5"/><rect x="164" y="138" width="20" height="5"/><rect x="72" y="154" width="40" height="5"/><rect x="160" y="154" width="24" height="5"/><rect x="72" y="170" width="56" height="5"/><rect x="164" y="170" width="20" height="5"/></g>
    <path d="M72 190 H184" stroke="#B9B1AD" stroke-dasharray="3 3"/>
    <text x="72" y="210" class="b" font-size="10" fill="#111" font-weight="700">Total</text>
    <text x="184" y="210" text-anchor="end" class="d" font-size="12" fill="#111">128,000</text>
    <g fill="#111"><rect x="84" y="234" width="2" height="34"/><rect x="89" y="234" width="4" height="34"/><rect x="96" y="234" width="1.5" height="34"/><rect x="100" y="234" width="3" height="34"/><rect x="106" y="234" width="2" height="34"/><rect x="111" y="234" width="5" height="34"/><rect x="119" y="234" width="1.5" height="34"/><rect x="123" y="234" width="3" height="34"/><rect x="129" y="234" width="2" height="34"/><rect x="134" y="234" width="4" height="34"/><rect x="141" y="234" width="1.5" height="34"/><rect x="145" y="234" width="3" height="34"/><rect x="151" y="234" width="2" height="34"/><rect x="156" y="234" width="4" height="34"/><rect x="163" y="234" width="2" height="34"/><rect x="168" y="234" width="3" height="34"/></g>
    <!-- Scan -->
    <rect x="52" y="150" width="152" height="50" fill="url(#scan)"/>
    <rect x="48" y="199" width="160" height="2.5" fill="#6B7C98"/>
  </g>

  <g transform="translate(226 180)"><circle r="17" fill="#2A2523"/><path d="M-6 0 h12 M1 -5 l5 5 l-5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- Extraction result -->
  <g filter="url(#sh)"><rect x="256" y="64" width="196" height="232" rx="4" fill="#FFFFFF"/></g>
  <rect x="256" y="64" width="196" height="4" fill="#6B7C98"/>
  <g transform="translate(274 86)"><rect width="76" height="20" rx="10" fill="#E3E8F0"/><text x="38" y="14" text-anchor="middle" class="m" font-size="7.6" fill="#6B7C98">AI auto-extract</text></g>
  <g class="b">
    <g transform="translate(274 128)"><text font-size="9" fill="#67636A">Vendor</text><text y="18" font-size="12.5" fill="#111" font-weight="700">Pangyo Trading</text></g>
    <g transform="translate(274 170)"><text font-size="9" fill="#67636A">Date</text><text y="18" font-size="12.5" fill="#111" font-weight="700">2026.11.12</text></g>
    <g transform="translate(274 212)"><text font-size="9" fill="#67636A">Amount</text><text y="18" font-size="12.5" fill="#111" font-weight="700">₩128,000</text></g>
    <g transform="translate(274 254)"><text font-size="9" fill="#67636A">Account (suggested)</text><text y="18" font-size="12.5" fill="#6B7C98" font-weight="700">Supplies</text></g>
  </g>
  <g fill="#111">
    <circle cx="428" cy="140" r="7"/><circle cx="428" cy="182" r="7"/><circle cx="428" cy="224" r="7"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M424.5 140 l2.5 2.5 l4 -4.5"/><path d="M424.5 182 l2.5 2.5 l4 -4.5"/><path d="M424.5 224 l2.5 2.5 l4 -4.5"/></g>
  <circle cx="428" cy="266" r="7" fill="none" stroke="#6B7C98" stroke-width="1.6"/><text x="428" y="269.5" text-anchor="middle" class="m" font-size="9" fill="#6B7C98">?</text>
  <g class="b" font-size="9" fill="#67636A"><rect x="256" y="152" width="196" height="1" fill="#E4E0E0"/><rect x="256" y="194" width="196" height="1" fill="#E4E0E0"/><rect x="256" y="236" width="196" height="1" fill="#E4E0E0"/></g>
</svg>

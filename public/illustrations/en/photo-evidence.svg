<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Sample screen: field photos taken on a phone are auto-tagged with location, time, and job number, then organized by job">
  <style>.d{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}.b{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,monospace}</style>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111" flood-opacity=".16"/></filter>
    <clipPath id="scr"><rect x="104" y="34" width="272" height="572" rx="30"/></clipPath>
    <g id="ph"><rect width="76" height="58" rx="2" fill="#5E5653"/><path d="M6 50 l20 -22 l14 12 l10 -8 l20 18 z" fill="#67636A"/><circle cx="58" cy="14" r="6" fill="#67636A"/></g></defs>
  <rect width="800" height="640" fill="#F3F1F1"/>
  <circle cx="540" cy="320" r="250" fill="#E3E8F0"/>

  <!-- Photos-by-job card -->
  <g filter="url(#sh)"><rect x="420" y="120" width="320" height="400" rx="4" fill="#fff"/></g>
  <rect x="420" y="120" width="320" height="4" fill="#6B7C98"/>
  <text x="444" y="158" class="m" font-size="10" fill="#6B7C98" letter-spacing="1.4">Job #W-2041</text>
  <text x="444" y="184" class="d" font-size="17" fill="#111">Bldg B pipe replacement · photos</text>
  <text x="444" y="204" class="b" font-size="11" fill="#67636A">6 photos · Pangyo Bldg B, 3F · Tech S. Lee</text>
  <g transform="translate(444 222)">
    <use href="#ph"/><use href="#ph" x="92"/><use href="#ph" x="184"/>
    <use href="#ph" y="92"/><use href="#ph" x="92" y="92"/><use href="#ph" x="184" y="92"/>
    <g class="m" font-size="8.5" fill="#5E5653">
      <text y="72">09:12 before</text><text x="92" y="72">10:40 removal</text><text x="184" y="72">11:05 piping</text>
      <text y="164">13:20 fitting</text><text x="92" y="164">14:02 leak test</text><text x="184" y="164" fill="#6B7C98">14:32 done</text>
    </g>
    <rect x="182" y="90" width="80" height="62" fill="none" stroke="#6B7C98" stroke-width="2"/>
  </g>
  <rect x="444" y="412" width="272" height="1" fill="#D3CDCB"/>
  <g class="b" font-size="11" fill="#5E5653"><text x="444" y="438">Customer sign-off</text><text x="716" y="438" text-anchor="end" fill="#111" font-weight="700">Signed</text></g>
  <rect x="444" y="458" width="272" height="40" rx="3" fill="#111"/><text x="580" y="483" text-anchor="middle" class="d" font-size="12.5" fill="#fff">Export evidence report (PDF)</text>

  <!-- Phone camera -->
  <g filter="url(#sh)"><rect x="90" y="20" width="300" height="600" rx="42" fill="#111"/></g>
  <g clip-path="url(#scr)">
    <rect x="104" y="34" width="272" height="572" fill="#2E2E2E"/>
    <!-- Viewfinder scene -->
    <rect x="104" y="110" width="272" height="360" fill="#5E5653"/>
    <rect x="104" y="350" width="272" height="120" fill="#424242"/>
    <g fill="none" stroke="#67636A" stroke-width="16" stroke-linecap="round"><path d="M104 250 H220 Q250 250 250 280 V470"/></g>
    <g fill="none" stroke="#ABABAB" stroke-width="5"><path d="M104 250 H220 Q250 250 250 280 V470"/></g>
    <rect x="236" y="300" width="28" height="18" fill="#B9B1AD"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M150 170 v-20 h20"/><path d="M330 170 v-20 h-20"/><path d="M150 410 v20 h20"/><path d="M330 410 v20 h-20"/></g>
    <!-- Top -->
    <text x="130" y="64" class="b" font-size="12" font-weight="700" fill="#fff">9:41</text>
    <rect x="208" y="48" width="64" height="20" rx="10" fill="#111"/>
    <g transform="translate(124 82)"><rect width="232" height="24" rx="12" fill="#111" fill-opacity=".7"/><text x="116" y="16.5" text-anchor="middle" class="b" font-size="10.5" fill="#fff">Job #W-2041 · Bldg B pipe replacement</text></g>
    <!-- Auto tags -->
    <g class="m" font-size="10" fill="#fff">
      <g transform="translate(120 400)"><rect width="150" height="22" rx="2" fill="#6B7C98"/><text x="10" y="15">● Pangyo Bldg B, 3F</text></g>
      <g transform="translate(120 428)"><rect width="150" height="22" rx="2" fill="#111" fill-opacity=".8"/><text x="10" y="15">2026.11.12 14:32</text></g>
    </g>
    <!-- Shutter -->
    <rect x="104" y="470" width="272" height="136" fill="#111"/>
    <g class="b" font-size="10.5" fill="#ABABAB"><text x="140" y="500">Photo</text><text x="226" y="500" text-anchor="middle" fill="#AEBBD1" font-weight="700">Evidence</text><text x="318" y="500">Video</text></g>
    <circle cx="240" cy="548" r="30" fill="none" stroke="#fff" stroke-width="4"/><circle cx="240" cy="548" r="23" fill="#6B7C98"/>
    <rect x="130" y="530" width="38" height="38" rx="4" fill="#5E5653" stroke="#fff" stroke-width="1.5"/>
    <text x="149" y="554" text-anchor="middle" class="d" font-size="11" fill="#fff">5</text>
  </g>

  <g transform="translate(404 320)"><circle r="20" fill="#111"/><path d="M-7 0 h14 M2 -6 l6 6 l-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Scattered Excel files being organized into a single database">
  <style>.d{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}.b{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,monospace}</style>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111" flood-opacity=".14"/></filter>
    <g id="sheet">
      <rect width="150" height="170" rx="3" fill="#FFFFFF"/>
      <rect width="150" height="22" fill="#E4E0E0"/>
      <g stroke="#D3CDCB" stroke-width="1">
        <path d="M0 44 H150 M0 66 H150 M0 88 H150 M0 110 H150 M0 132 H150 M0 154 H150"/>
        <path d="M30 22 V170 M80 22 V170 M118 22 V170"/>
      </g>
      <g fill="#B9B1AD"><rect x="36" y="30" width="30" height="6"/><rect x="86" y="30" width="22" height="6"/><rect x="36" y="52" width="38" height="6"/><rect x="86" y="52" width="18" height="6"/><rect x="36" y="74" width="26" height="6"/><rect x="36" y="96" width="34" height="6"/><rect x="86" y="96" width="24" height="6"/><rect x="36" y="118" width="30" height="6"/><rect x="36" y="140" width="40" height="6"/></g>
    </g>
  </defs>
  <rect width="480" height="360" fill="#F3F1F1"/>
  <circle cx="350" cy="190" r="130" fill="#E3E8F0"/>

  <g filter="url(#sh)">
    <g transform="translate(70 118) rotate(-6)"><use href="#sheet"/></g>
    <g transform="translate(52 96) rotate(3)"><use href="#sheet"/></g>
    <g transform="translate(38 82)">
      <use href="#sheet"/>
      <rect x="80" y="66" width="38" height="22" fill="#E3E8F0" stroke="#6B7C98" stroke-width="1.5"/>
      <rect x="30" y="110" width="50" height="22" fill="#E3E8F0" stroke="#6B7C98" stroke-width="1.5"/>
    </g>
  </g>
  <g class="m" font-size="10" fill="#5E5653">
    <text x="38" y="70">orders_final(2).xlsx</text>
  </g>
  <g transform="translate(118 280)" class="b" font-size="10.5" fill="#6B7C98">
    <rect x="-8" y="-14" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#6B7C98"/>
    <text x="44" y="1" text-anchor="middle">12 dupes · errors</text>
  </g>

  <g transform="translate(232 170)"><circle r="17" fill="#2A2523"/><path d="M-6 0 h12 M1 -5 l5 5 l-5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>

  <g filter="url(#sh)">
    <g transform="translate(272 58)">
      <rect width="168" height="74" rx="3" fill="#FFFFFF"/><rect width="168" height="24" rx="3" fill="#2A2523"/><rect y="20" width="168" height="4" fill="#2A2523"/>
      <text x="12" y="16.5" class="d" font-size="11.5" fill="#FFFFFF">Customers</text>
      <g class="m" font-size="9.5" fill="#5E5653"><text x="12" y="42">id · name · contact</text><text x="12" y="60">phone · payment terms</text></g>
    </g>
    <g transform="translate(296 146)">
      <rect width="168" height="74" rx="3" fill="#FFFFFF"/><rect width="168" height="24" rx="3" fill="#6B7C98"/><rect y="20" width="168" height="4" fill="#6B7C98"/>
      <text x="12" y="16.5" class="d" font-size="11.5" fill="#FFFFFF">Orders</text>
      <g class="m" font-size="9.5" fill="#5E5653"><text x="12" y="42">customer · item · qty</text><text x="12" y="60">date · status</text></g>
    </g>
    <g transform="translate(272 234)">
      <rect width="168" height="74" rx="3" fill="#FFFFFF"/><rect width="168" height="24" rx="3" fill="#2A2523"/><rect y="20" width="168" height="4" fill="#2A2523"/>
      <text x="12" y="16.5" class="d" font-size="11.5" fill="#FFFFFF">Inventory</text>
      <g class="m" font-size="9.5" fill="#5E5653"><text x="12" y="42">item · warehouse · qty</text><text x="12" y="60">receiving · shipping log</text></g>
    </g>
  </g>
  <g fill="none" stroke="#6B7C98" stroke-width="1.6" stroke-linecap="round">
    <path d="M440 96 q20 0 20 30 v20"/><path d="M440 270 q20 0 20 -30 v-20"/>
  </g>
  <g fill="#6B7C98"><circle cx="460" cy="146" r="3"/><circle cx="460" cy="220" r="3"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Sample ERP dashboard managing accounting and inventory on one screen">
  <style>.d{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}.b{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,monospace}</style>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111" flood-opacity=".16"/></filter>
    <clipPath id="scr"><rect x="76" y="86" width="560" height="350"/></clipPath></defs>
  <rect width="800" height="640" fill="#F3F1F1"/>
  <circle cx="420" cy="300" r="260" fill="#E3E8F0"/>

  <!-- Laptop -->
  <g filter="url(#sh)">
    <rect x="62" y="72" width="588" height="378" rx="14" fill="#111"/>
    <path d="M22 450 H690 L668 478 Q662 486 650 486 H62 Q50 486 44 478 Z" fill="#2E2E2E"/>
    <rect x="316" y="450" width="80" height="7" rx="3" fill="#5E5653"/>
  </g>
  <g clip-path="url(#scr)">
    <rect x="76" y="86" width="560" height="350" fill="#fff"/>
    <!-- Side menu -->
    <rect x="76" y="86" width="116" height="350" fill="#111"/>
    <g fill="#6B7C98"><rect x="92" y="104" width="16" height="3"/><rect x="92" y="110" width="16" height="3"/><rect x="92" y="116" width="16" height="3"/></g>
    <text x="116" y="117" class="d" font-size="11" fill="#F0F0F0">Our ERP</text>
    <g class="b" font-size="11" fill="#ABABAB">
      <text x="96" y="160">Dashboard</text>
      <rect x="76" y="174" width="116" height="28" fill="#2E2E2E"/><rect x="76" y="174" width="3" height="28" fill="#6B7C98"/>
      <text x="96" y="192" fill="#fff" font-weight="700">Inventory</text>
      <text x="96" y="224">Accounting</text><text x="96" y="252">Customers</text><text x="96" y="280">Purchases · Sales</text><text x="96" y="308">Reports</text>
    </g>
    <!-- Main content -->
    <text x="212" y="120" class="d" font-size="16" fill="#111">Inventory Overview</text>
    <text x="212" y="138" class="b" font-size="10" fill="#67636A">Synced with accounting &amp; sales · As of Nov 12</text>
    <g class="b" font-size="9.5" fill="#67636A">
      <rect x="212" y="152" width="130" height="58" fill="#F3F1F1"/><text x="224" y="170">Revenue this month</text><text x="224" y="196" class="d" font-size="18" fill="#111">₩420M</text>
      <rect x="350" y="152" width="130" height="58" fill="#F3F1F1"/><text x="362" y="170">Receivables</text><text x="362" y="196" class="d" font-size="18" fill="#111">₩31.8M</text>
      <rect x="488" y="152" width="130" height="58" fill="#E3E8F0"/><text x="500" y="170" fill="#6B7C98">Below safety stock</text><text x="500" y="196" class="d" font-size="18" fill="#6B7C98">4 items</text>
    </g>
    <!-- Bar chart -->
    <g transform="translate(212 226)">
      <text class="m" font-size="8.5" fill="#67636A" y="8">Monthly receiving · shipping</text>
      <g fill="#D3CDCB"><rect x="0" y="40" width="14" height="50"/><rect x="34" y="30" width="14" height="60"/><rect x="68" y="44" width="14" height="46"/><rect x="102" y="24" width="14" height="66"/><rect x="136" y="34" width="14" height="56"/></g>
      <g fill="#111"><rect x="15" y="50" width="14" height="40"/><rect x="49" y="36" width="14" height="54"/><rect x="83" y="40" width="14" height="50"/><rect x="117" y="30" width="14" height="60"/><rect x="151" y="20" width="14" height="70" fill="#6B7C98"/></g>
      <rect y="90" width="170" height="1" fill="#B9B1AD"/>
    </g>
    <!-- Table -->
    <g transform="translate(400 226)" class="b" font-size="9.5">
      <g class="m" font-size="8" fill="#67636A"><text y="8">Item</text><text x="120" y="8">On hand</text><text x="176" y="8">Status</text></g>
      <rect y="14" width="218" height="1" fill="#D3CDCB"/>
      <g fill="#111">
        <text y="32">Stainless bolt M8</text><text x="120" y="32">12,400</text>
        <text y="54">Cooling fan 120mm</text><text x="120" y="54" fill="#6B7C98" font-weight="700">38</text>
        <text y="76">Pressure gauge G2</text><text x="120" y="76" fill="#6B7C98" font-weight="700">6</text>
        <text y="98">Pipe fitting 25A</text><text x="120" y="98">2,150</text>
      </g>
      <g font-size="8"><rect x="176" y="22" width="36" height="13" rx="6.5" fill="#E4E0E0"/><text x="194" y="31.5" text-anchor="middle" fill="#5E5653">OK</text>
      <rect x="176" y="44" width="36" height="13" rx="6.5" fill="#6B7C98"/><text x="194" y="53.5" text-anchor="middle" fill="#fff" font-size="7.5">Reorder</text>
      <rect x="176" y="66" width="36" height="13" rx="6.5" fill="#6B7C98"/><text x="194" y="75.5" text-anchor="middle" fill="#fff" font-size="7.5">Reorder</text>
      <rect x="176" y="88" width="36" height="13" rx="6.5" fill="#E4E0E0"/><text x="194" y="97.5" text-anchor="middle" fill="#5E5653">OK</text></g>
      <g fill="#E4E0E0"><rect y="40" width="218" height="1"/><rect y="62" width="218" height="1"/><rect y="84" width="218" height="1"/></g>
    </g>
    <rect x="212" y="350" width="406" height="1" fill="#E4E0E0"/>
    <g class="b" font-size="10" fill="#5E5653"><text x="212" y="374">Recent entries</text><text x="618" y="374" text-anchor="end" class="m" font-size="9">Auto-generated · Sale A-1093 → revenue entry</text></g>
    <rect x="212" y="386" width="406" height="30" fill="#F3F1F1"/>
    <g class="b" font-size="10" fill="#111"><text x="224" y="405">Nov 12 · Revenue · Pangyo Trading</text><text x="606" y="405" text-anchor="end" font-weight="700">12,800,000</text></g>
  </g>

  <g transform="translate(20 -360)">
  <!-- Month-close card -->
  <g filter="url(#sh)"><rect x="560" y="400" width="200" height="88" rx="4" fill="#111"/></g>
  <circle cx="590" cy="444" r="13" fill="none" stroke="#AEBBD1" stroke-width="2.4"/>
  <path d="M583.5 444 l4.5 4.5 l8 -9" fill="none" stroke="#AEBBD1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="614" y="438" class="d" font-size="13" fill="#F0F0F0">October books closed</text>
  <text x="614" y="458" class="m" font-size="9.5" fill="#ABABAB">Ledger · stock match</text>
  </g>
</svg>

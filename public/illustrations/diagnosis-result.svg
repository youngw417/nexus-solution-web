<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="시스템화 진단 결과 화면 예시: 종합 점수, 두 가지 축 점수, 결과 유형과 추천 첫 단계">
  <style>.d{font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}.b{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,monospace}</style>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#111" flood-opacity=".14"/></filter></defs>
  <rect width="640" height="440" fill="#F3F1F1"/>
  <circle cx="470" cy="250" r="190" fill="#E3E8F0"/>

  <!-- 결과 카드 -->
  <g filter="url(#sh)"><rect x="40" y="36" width="420" height="368" rx="4" fill="#fff"/></g>
  <g fill="#6B7C98"><rect x="64" y="62" width="14" height="2.5"/><rect x="64" y="67" width="14" height="2.5"/><rect x="64" y="72" width="14" height="2.5"/></g>
  <text x="86" y="73" class="m" font-size="10.5" fill="#6B7C98" letter-spacing="1.4">진단 결과</text>

  <text x="64" y="106" class="m" font-size="10" fill="#67636A">시스템화 진단 종합</text>
  <text x="64" y="152" class="d" font-size="50" fill="#111" letter-spacing="-2">60<tspan font-size="22" fill="#67636A">%</tspan></text>

  <g class="b" font-size="11.5">
    <text x="196" y="104" fill="#111" font-weight="700">시스템화 효과</text><text x="436" y="104" text-anchor="end" class="m" font-size="10.5" fill="#111">78%</text>
    <rect x="196" y="112" width="240" height="8" fill="#E4E0E0"/><rect x="196" y="112" width="187" height="8" fill="#6B7C98"/>
    <text x="196" y="142" fill="#111" font-weight="700">데이터 준비도</text><text x="436" y="142" text-anchor="end" class="m" font-size="10.5" fill="#111">41%</text>
    <rect x="196" y="150" width="240" height="8" fill="#E4E0E0"/><rect x="196" y="150" width="98" height="8" fill="#111"/>
  </g>

  <text x="64" y="200" class="d" font-size="18" fill="#111">효과는 크지만, 데이터 정리가 먼저인 회사</text>
  <text x="64" y="224" class="b" font-size="11" fill="#5E5653">시스템으로 바꾸면 줄어드는 일이 많습니다. 데이터부터</text>
  <text x="64" y="241" class="b" font-size="11" fill="#5E5653">정리하면 구축에 속도가 붙습니다.</text>

  <rect x="64" y="262" width="372" height="118" fill="#fff" stroke="#D3CDCB"/>
  <rect x="290" y="262" width="1" height="118" fill="#D3CDCB"/>
  <text x="80" y="286" class="m" font-size="9.5" fill="#6B7C98" letter-spacing="1.2">추천 첫 단계</text>
  <g class="b" font-size="10.5" fill="#111">
    <text x="80" y="310"><tspan fill="#6B7C98">1.</tspan> 흩어진 엑셀 현황 파악</text>
    <text x="80" y="332"><tspan fill="#6B7C98">2.</tspan> 하나의 DB 구조 설계</text>
    <text x="80" y="354"><tspan fill="#6B7C98">3.</tspan> 우선순위와 단계별 계획</text>
  </g>
  <text x="306" y="286" class="m" font-size="9.5" fill="#67636A" letter-spacing="1.2">맞는 서비스</text>
  <text x="306" y="312" class="d" font-size="13" fill="#111">데이터 정리 진단</text>
  <text x="306" y="362" class="d" font-size="11" fill="#6B7C98">자세히 보기 →</text>

  <!-- 리포트 메일 카드 -->
  <g filter="url(#sh)"><rect x="410" y="250" width="200" height="132" rx="4" fill="#111"/></g>
  <g transform="translate(430 274)">
    <rect width="30" height="22" rx="2" fill="none" stroke="#AEBBD1" stroke-width="2"/>
    <path d="M1 2 L15 13 L29 2" fill="none" stroke="#AEBBD1" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="430" y="324" class="d" font-size="13" fill="#F0F0F0">상세 리포트 발송</text>
  <text x="430" y="344" class="b" font-size="10" fill="#ABABAB">영역별 해설 · 시스템화 순서</text>
  <text x="430" y="362" class="b" font-size="10" fill="#ABABAB">내부 보고 자료로 바로 사용</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="휴대폰 현장 점검 앱 화면과 자동 생성된 보고서 예시">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A2523" flood-opacity=".16"/>
    </filter>
    <clipPath id="screen"><rect x="14" y="14" width="272" height="572" rx="30"/></clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="640" fill="#F3F1F1"/>
  <circle cx="520" cy="330" r="250" fill="#E3E8F0"/>


  <g font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

    <!-- 보고서 카드 (뒤) -->
    <g transform="translate(420 110)" filter="url(#shadow)">
      <rect width="300" height="390" rx="4" fill="#FFFFFF"/>
      <rect width="300" height="4" fill="#6B7C98"/>
      <text x="24" y="40" font-size="10" fill="#6B7C98" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="1.4">자동 생성 · PDF</text>
      <text x="24" y="66" font-size="17" font-weight="700" fill="#2A2523" font-family="'Gothic A1', 'Apple SD Gothic Neo', sans-serif">설비 점검 보고서</text>
      <text x="24" y="86" font-size="11" fill="#67636A">2026.11.12 · 2공장 · 담당 김OO</text>
      <rect x="24" y="102" width="252" height="1" fill="#D3CDCB"/>

      <g font-size="11.5" fill="#5E5653">
        <text x="24" y="128">점검 항목</text><text x="276" y="128" text-anchor="end" fill="#2A2523" font-weight="700">40</text>
        <text x="24" y="152">정상</text><text x="276" y="152" text-anchor="end" fill="#2A2523" font-weight="700">38</text>
        <text x="24" y="176">이상 · 조치 필요</text><text x="276" y="176" text-anchor="end" fill="#6B7C98" font-weight="700">2</text>
      </g>
      <rect x="24" y="192" width="252" height="8" fill="#E4E0E0"/>
      <rect x="24" y="192" width="239" height="8" fill="#2A2523"/>
      <rect x="263" y="192" width="13" height="8" fill="#6B7C98"/>

      <text x="24" y="230" font-size="10" fill="#67636A" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="1.2">이상 항목</text>
      <g transform="translate(24 242)">
        <rect width="252" height="52" fill="#E3E8F0"/>
        <rect width="3" height="52" fill="#6B7C98"/>
        <text x="14" y="21" font-size="12" font-weight="700" fill="#2A2523">B-12 냉각팬 소음</text>
        <text x="14" y="39" font-size="10.5" fill="#5E5653">사진 2장 · 부품 교체 요청</text>
      </g>
      <g transform="translate(24 302)">
        <rect width="252" height="52" fill="#E3E8F0"/>
        <rect width="3" height="52" fill="#6B7C98"/>
        <text x="14" y="21" font-size="12" font-weight="700" fill="#2A2523">C-03 압력 게이지 편차</text>
        <text x="14" y="39" font-size="10.5" fill="#5E5653">사진 1장 · 재측정 예정</text>
      </g>
      <text x="24" y="376" font-size="10" fill="#67636A">검토 · 승인 대기 — 생산팀장</text>
    </g>

    <!-- 휴대폰 -->
    <g transform="translate(90 20)" filter="url(#shadow)">
      <rect width="300" height="600" rx="42" fill="#2A2523"/>
      <g clip-path="url(#screen)">
        <rect x="14" y="14" width="272" height="572" fill="#FFFFFF"/>

        <!-- 상태 표시줄 -->
        <text x="40" y="44" font-size="12" font-weight="700" fill="#2A2523">9:41</text>
        <rect x="118" y="28" width="64" height="20" rx="10" fill="#2A2523"/>
        <rect x="236" y="34" width="22" height="10" rx="2" fill="none" stroke="#2A2523" stroke-width="1.4"/>
        <rect x="238" y="36" width="15" height="6" rx="1" fill="#2A2523"/>

        <!-- 앱 헤더 -->
        <g transform="translate(14 62)">
          <rect width="272" height="58" fill="#FFFFFF"/>
          <path d="M26 22 l-8 7 l8 7" fill="none" stroke="#2A2523" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="136" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#2A2523" font-family="'Gothic A1', 'Apple SD Gothic Neo', sans-serif">설비 점검</text>
          <text x="252" y="35" text-anchor="end" font-size="11" fill="#67636A" font-family="'IBM Plex Mono', ui-monospace, monospace">3/5</text>
          <rect y="56" width="272" height="2" fill="#E4E0E0"/>
          <rect y="56" width="163" height="2" fill="#6B7C98"/>
        </g>

        <!-- 기본 정보 -->
        <g transform="translate(34 138)">
          <text font-size="10" fill="#67636A" y="0">설비 번호</text>
          <rect y="8" width="232" height="36" rx="3" fill="#F3F1F1" stroke="#D3CDCB"/>
          <text x="12" y="31" font-size="13" fill="#2A2523" font-weight="500">B-12 · 냉각 라인</text>
          <path d="M214 23 l5 5 l5 -5" fill="none" stroke="#5E5653" stroke-width="1.6" stroke-linecap="round"/>
        </g>

        <!-- 점검 항목 -->
        <g transform="translate(34 206)" font-size="12.5">
          <text font-size="10" fill="#67636A" y="0">점검 항목</text>

          <g transform="translate(0 12)">
            <text y="18" fill="#2A2523">전원 · 배선 상태</text>
            <rect x="152" y="2" width="38" height="24" rx="3" fill="#2A2523"/><text x="171" y="18.5" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">정상</text>
            <rect x="194" y="2" width="38" height="24" rx="3" fill="#FFFFFF" stroke="#D3CDCB"/><text x="213" y="18.5" text-anchor="middle" font-size="11" fill="#67636A">이상</text>
          </g>
          <g transform="translate(0 50)">
            <text y="18" fill="#2A2523">윤활 · 오일 수준</text>
            <rect x="152" y="2" width="38" height="24" rx="3" fill="#2A2523"/><text x="171" y="18.5" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">정상</text>
            <rect x="194" y="2" width="38" height="24" rx="3" fill="#FFFFFF" stroke="#D3CDCB"/><text x="213" y="18.5" text-anchor="middle" font-size="11" fill="#67636A">이상</text>
          </g>
          <g transform="translate(0 88)">
            <text y="18" fill="#2A2523" font-weight="700">냉각팬 소음</text>
            <rect x="152" y="2" width="38" height="24" rx="3" fill="#FFFFFF" stroke="#D3CDCB"/><text x="171" y="18.5" text-anchor="middle" font-size="11" fill="#67636A">정상</text>
            <rect x="194" y="2" width="38" height="24" rx="3" fill="#6B7C98"/><text x="213" y="18.5" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">이상</text>
          </g>

          <!-- 이상 시 메모 · 사진 -->
          <g transform="translate(0 124)">
            <rect width="232" height="128" rx="3" fill="#E3E8F0"/>
            <text x="12" y="22" font-size="10" fill="#6B7C98">메모</text>
            <text x="12" y="42" font-size="12" fill="#2A2523">회전 시 금속 마찰음, 교체 필요</text>
            <text x="12" y="66" font-size="10" fill="#6B7C98">사진 · 위치와 시간 자동 기록</text>
            <g transform="translate(12 74)">
              <rect width="62" height="44" rx="2" fill="#5E5653"/>
              <path d="M8 36 l14 -14 l10 9 l8 -6 l14 11 z" fill="#67636A"/>
              <rect x="70" width="62" height="44" rx="2" fill="#5E5653"/>
              <circle cx="116" cy="12" r="5" fill="#67636A"/>
              <path d="M78 36 l16 -12 l20 12 z" fill="#67636A"/>
              <rect x="140" width="62" height="44" rx="2" fill="#FFFFFF" stroke="#6B7C98" stroke-dasharray="4 3"/>
              <path d="M163 22 h16 M171 14 v16" stroke="#6B7C98" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- 하단 버튼 -->
        <g transform="translate(34 506)">
          <rect width="232" height="46" rx="3" fill="#6B7C98"/>
          <text x="116" y="28.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF" font-family="'Gothic A1', 'Apple SD Gothic Neo', sans-serif">제출 · 보고서 자동 생성</text>
        </g>
        <rect x="110" y="566" width="80" height="4" rx="2" fill="#2A2523"/>
      </g>
    </g>

    <!-- 연결 화살표 -->
    <g transform="translate(392 300)">
      <circle r="20" fill="#2A2523"/>
      <path d="M-7 0 h14 M2 -6 l6 6 l-6 6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

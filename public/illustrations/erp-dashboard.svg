    </g>
    <!-- 본문 -->
    <text x="212" y="120" class="d" font-size="16" fill="#111">재고 현황</text>
    <text x="212" y="138" class="b" font-size="10" fill="#67636A">회계 · 판매와 자동 연동 · 11월 12일 기준</text>
    <g class="b" font-size="9.5" fill="#67636A">
      <rect x="212" y="152" width="130" height="58" fill="#F3F1F1"/><text x="224" y="170">이번 달 매출</text><text x="224" y="196" class="d" font-size="18" fill="#111">4.2억</text>
      <rect x="350" y="152" width="130" height="58" fill="#F3F1F1"/><text x="362" y="170">미수금</text><text x="362" y="196" class="d" font-size="18" fill="#111">3,180만</text>
      <rect x="488" y="152" width="130" height="58" fill="#E3E8F0"/><text x="500" y="170" fill="#6B7C98">안전재고 미달</text><text x="500" y="196" class="d" font-size="18" fill="#6B7C98">4개 품목</text>
    </g>

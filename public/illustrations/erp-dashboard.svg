      <g font-size="8"><rect x="176" y="22" width="36" height="13" rx="6.5" fill="#E4E0E0"/><text x="194" y="31.5" text-anchor="middle" fill="#5E5653">정상</text>
      <rect x="176" y="44" width="36" height="13" rx="6.5" fill="#6B7C98"/><text x="194" y="53.5" text-anchor="middle" fill="#fff">발주</text>
      <rect x="176" y="66" width="36" height="13" rx="6.5" fill="#6B7C98"/><text x="194" y="75.5" text-anchor="middle" fill="#fff">발주</text>
      <rect x="176" y="88" width="36" height="13" rx="6.5" fill="#E4E0E0"/><text x="194" y="97.5" text-anchor="middle" fill="#5E5653">정상</text></g>
      <g fill="#E4E0E0"><rect y="40" width="218" height="1"/><rect y="62" width="218" height="1"/><rect y="84" width="218" height="1"/></g>

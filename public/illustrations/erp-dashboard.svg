  </g>

  <g transform="translate(20 -360)">
  <!-- 마감 카드 -->
  <g filter="url(#sh)"><rect x="560" y="400" width="200" height="88" rx="4" fill="#111"/></g>
  <circle cx="590" cy="444" r="13" fill="none" stroke="#AEBBD1" stroke-width="2.4"/>
  <path d="M583.5 444 l4.5 4.5 l8 -9" fill="none" stroke="#AEBBD1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="614" y="438" class="d" font-size="13" fill="#F0F0F0">10월 마감 완료</text>
  <text x="614" y="458" class="m" font-size="9.5" fill="#ABABAB">장부 · 재고 숫자 일치</text>
  </g>
</svg>

    <rect x="212" y="350" width="406" height="1" fill="#E4E0E0"/>
    <g class="b" font-size="10" fill="#5E5653"><text x="212" y="374">최근 전표</text><text x="618" y="374" text-anchor="end" class="m" font-size="9">자동 생성 · 판매 A-1093 → 매출 전표</text></g>
    <rect x="212" y="386" width="406" height="30" fill="#F3F1F1"/>
